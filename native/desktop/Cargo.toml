[package]
name = "cryss-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[[bin]]
name = "cryss"
path = "src/main.rs"

[features]
capture = ["eframe/__screenshot"]

[target.'cfg(windows)'.dependencies]
cryss-native = { path = "../cryss" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "accesskit", "clipboard"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "0.15"
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
tray-icon = "0.26.1"
ureq = "3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[build-dependencies]
embed-manifest = "1.5.1"
